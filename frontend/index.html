    <title>[PLATFORM_NAME] — Multilingual Voice AI Assessment &amp; Viva Platform</title>
    <!-- No-flash theme bootstrap: runs before paint. Default = dark. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pn_theme') || 'dark';
          var c = document.documentElement.classList;
          c.remove('dark', 'light');
          c.add(t === 'light' ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"

    />
